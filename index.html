<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Portfolio — N.KAILASH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="Elegante Logo _N.K._ en Gradiente.png">
<link rel="stylesheet" href="style.css">
<style>
  body{align-items:center;justify-content:center;min-height:100vh;position:relative;opacity:0;animation:fadeIn 1.1s ease forwards;}
  @keyframes fadeIn{to{opacity:1;}}
  body::after{
    content:"";position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;z-index:1;
  }
  .particle{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle, rgba(75,245,224,0.9), transparent 70%);animation:drift 6s linear forwards;}
  @keyframes drift{from{transform:translateY(0);opacity:0.7;}to{transform:translateY(-120px);opacity:0;}}
  .panel{width:380px;position:relative;z-index:2;padding:44px 40px 36px;text-align:center;background:rgba(13,21,38,0.65);backdrop-filter:blur(18px);}
  .panel button{width:100%;margin-top:10px;}
  .error{color:#ff5d7a;font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:14px;display:none;}
</style>
</head>
<body>

<div class="panel hud-frame">
  <span class="c2"></span><span class="c3"></span>
  <div class="eyebrow" style="justify-content:center;">Restricted Access</div>
  <h1 style="font-family:'Orbitron',sans-serif;font-weight:700;font-size:22px;letter-spacing:1px;margin-bottom:28px;color:#fff;">N.KAILASH // PORTFOLIO</h1>

  <div class="field">
    <label for="username">Identifier</label>
    <input type="text" id="username" placeholder="Enter your name">
  </div>
  <div class="field">
    <label for="password">Passkey</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="sign-in-btn" onclick="validateLogin()">Enter</button>
  <p class="error" id="errorMsg">Invalid credentials — try again.</p>
</div>

<script>
  function spawnParticle(){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random()*3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random()*window.innerWidth + 'px';
    p.style.top = (window.innerHeight + 10) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 6000);
  }
  setInterval(spawnParticle, 300);

  function validateLogin(){
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    if (password === "protagonistkanth") {
      window.location.href = "main.html";
    } else {
      errorMsg.style.display = "block";
      setTimeout(() => { errorMsg.style.display = "none"; }, 2000);
    }
  }
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') validateLogin();
  });
</script>
</body>
</html>
