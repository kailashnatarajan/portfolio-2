<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Login - N.KAILASH</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Elegante Logo _N.K._ en Gradiente.png">

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Fade-in animation for body */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      overflow: hidden;
      position: relative;
      color: #fff;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Particle base style */
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.2s ease;
    }

    /* Trail particles from cursor */
    .cursor-particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 1;
  animation: fadeOut 1s ease forwards;
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.9); /* Neon glow */
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: scale(0.5);
  }
}

    /* Login container */
    .login-container {
      position: relative;
      z-index: 2;
      width: 350px;
      padding: 40px;
      text-align: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      transition: 0.3s ease;
    }

    .login-container:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    /* Heading */
    .login-container h2 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 25px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* Input field */
    .login-container input {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      text-align: center;
      font-size: 16px;
      transition: 0.3s;
      outline: none;
    }

    .login-container input:focus {
      border-color: #00f5d4;
      box-shadow: 0 0 10px #00f5d4;
    }

    .login-container input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    /* Button */
    .login-container button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #00f5d4, #00bbf9, #4361ee);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .login-container button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 245, 212, 0.4);
    }

    /* Error message */
    .error {
      color: #ff4d4d;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Login form container -->
  <div class="login-container">
    <h2>Login to Portfolio</h2>

    <!-- Username -->
    <input type="text" id="username" placeholder="Enter Your Name">

    <!-- Password -->
    <input type="password" id="password" placeholder="Enter Password">

    <!-- Button -->
    <button onclick="validateLogin()">Login</button>

    <!-- Error message -->
    <p class="error" id="errorMsg">Invalid credentials! Please try again.</p>
  </div>

  <script>
    /* === CONSTANT BACKGROUND PARTICLES === */
  function createBackgroundParticle() {
    const particle = document.createElement('div');
    particle.classList.add('cursor-particle');

    // Random position anywhere on the screen
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;

    particle.style.left = `${x}px`;
    particle.style.top = `${y}px`;

    // Random vibrant color
    const hue = Math.floor(Math.random() * 360);
    particle.style.background = `hsl(${hue}, 80%, 60%)`;

    // Add to body
    document.body.appendChild(particle);

    // Remove particle after fade-out
    setTimeout(() => {
      particle.remove();
    }, 2000);
  }

  // Spawn background particles constantly
  setInterval(createBackgroundParticle, 30); 
  // Lower number = more particles (e.g., 10 = very dense)

  /* === CURSOR TRAIL PARTICLES === */
  document.addEventListener('mousemove', (e) => {
    const trail = document.createElement('div');
    trail.classList.add('cursor-particle');

    trail.style.left = `${e.clientX}px`;
    trail.style.top = `${e.clientY}px`;

    // Dynamic neon color
    const hue = Math.floor(Math.random() * 360);
    trail.style.background = `hsl(${hue}, 100%, 60%)`;
    trail.style.boxShadow = `0 0 20px hsl(${hue}, 100%, 60%)`;

    document.body.appendChild(trail);

    // Remove after fade out
    setTimeout(() => trail.remove(), 1000);
  });

  // Add particles when moving the mouse
  document.addEventListener('mousemove', (e) => {
    createCursorParticle(e.clientX, e.clientY);
  });

  /* === LOGIN VALIDATION === */
  function validateLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (password === "protagonistkanth") {
      window.location.href = "main.html"; // Redirect to your portfolio page
    } else {
      errorMsg.style.display = "block";
      setTimeout(() => {
        errorMsg.style.display = "none";
      }, 2000);
    }
  }
  </script>
</body>
</html>
