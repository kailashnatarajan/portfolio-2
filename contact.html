<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Me — N.KAILASH</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function(){
    emailjs.init("1GOLC1gOMs0h8WWJb");
  })();
  function sendMail(e) {
    e.preventDefault();
    emailjs.sendForm("service_kailash", "template_bhygv5w", "#contact-form")
      .then(function(){
        alert("✅ Message sent successfully!");
        document.getElementById("contact-form").reset();
      }, function(){
        alert("❌ Failed to send message. Please try again.");
      });
  }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/png" href="Elegante Logo _N.K._ en Gradiente.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="main.html" class="logo">N.KAILASH</a>
    <nav class="links">
      <a href="main.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="achievements.html">Achievements</a>
    </nav>
    <div class="nav-actions">
      <a href="signin.html" class="sign-in-btn">Sign In</a>
    </div>
  </div>
</header>

<main>
  <section class="section">
    <div class="page-heading">
      <div class="eyebrow">Get in touch</div>
      <h2>Contact Me</h2>
    </div>
    <p style="text-align:center;color:var(--muted);max-width:52ch;margin:0 auto 40px;font-size:16px;line-height:1.7;">
      Have a question, project idea, or just want to say hello? Fill out the form below and I'll get back to you as soon as possible.
    </p>

    <form id="contact-form" onsubmit="sendMail(event)" class="form-card" style="margin-bottom:80px;">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Send Message</button>
    </form>
  </section>
</main>

<footer class="footer">

</footer>
