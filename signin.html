<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — N.KAILASH</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/png" href="Elegante Logo _N.K._ en Gradiente.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{transition:transform .5s ease, opacity .5s ease;}
  body.slide-left{transform:translateX(-6%);opacity:0;}
  main{display:flex;align-items:center;justify-content:center;padding:60px 20px;}
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="main.html" class="logo">N.KAILASH</a>
    <nav class="links">
      <a href="main.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="achievements.html">Achievements</a>
    </nav>
  </div>
</header>

<main>
  <section class="form-card">
    <h2>Sign In</h2>
    <form action="#" method="POST">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Sign In</button>
    </form>
    <p class="form-footnote">Don't have an account? <a href="signup.html" id="create-account">Create one</a></p>
  </section>
</main>

<footer class="footer">
  <div class="social-icons">
    <a href="https://www.instagram.com/kailash_.kanth" target="_blank" class="instagram"><i class="fab fa-instagram"></i></a>
    <a href="https://wa.me/918489091701" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
    <a href="https://www.youtube.com" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
    <a href="https://www.linkedin.com" target="_blank" class="linkedin"><i class="fab fa-linkedin"></i></a>
    <a href="https://github.com" target="_blank" class="github"><i class="fab fa-github"></i></a>
    <a href="https://twitter.com" target="_blank" class="twitter"><i class="fab fa-twitter"></i></a>
    <a href="KailashResumeSimple.pdf" target="_blank" class="resume"><i class="fas fa-file-alt"></i></a>
    <a href="KailashResume.pdf" target="_blank" class="resume"><i class="fas fa-file-alt"></i></a>
  </div>
  <p>© 2026 N.KAILASH. All rights reserved.</p>
</footer>

<script>
  document.getElementById("create-account").addEventListener("click", function(e){
    e.preventDefault();
    document.body.classList.add("slide-left");
    setTimeout(() => { window.location.href = this.href; }, 450);
  });
</script>
</body>
</html>
